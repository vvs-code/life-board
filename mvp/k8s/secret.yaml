# Учебный стенд: секрет лежит в репозитории открытым текстом.
# В реальном окружении — Sealed Secrets / External Secrets / Vault, в git не коммитится.
apiVersion: v1
kind: Secret
metadata:
  name: lifeboard-db
type: Opaque
stringData:
  POSTGRES_USER: lifeboard
  POSTGRES_PASSWORD: lifeboard
  POSTGRES_DB: lifeboard
  DATABASE_URL: postgres://lifeboard:lifeboard@postgres:5432/lifeboard
