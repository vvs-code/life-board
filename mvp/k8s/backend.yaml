apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PORT: "3000"
  SHUTDOWN_DRAIN_MS: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: backend }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: lifeboard-backend:0.2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: lifeboard-db, key: DATABASE_URL }
          # Процесс жив? Не зависит от базы — иначе падение БД перезапускало бы все поды.
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Готов принимать трафик? База доступна и миграции применены.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app: backend }
spec:
  selector: { app: backend }
  ports:
    - name: http
      port: 3000
      targetPort: http
