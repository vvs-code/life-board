# Фактор XI: логи пишутся в stdout, Docker хранит их с ограничением размера.
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20
    logging: *logging

  # Фактор XII: миграции — разовый процесс из того же образа, что и backend.
  migrate:
    build: ./backend
    command: ["node", "src/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate: { condition: service_completed_successfully }
    # /readyz: база доступна и миграции применены.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+process.env.PORT+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:3000
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
